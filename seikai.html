<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>正解スタメン登録</title>

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.header {
    background: #0080c8;
    color: white;
    text-align: center;
    padding: 18px 10px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.logo {
    width: 180px;
    max-width: 80%;
}

.header h1 {
    margin: 8px 0 0;
    font-size: 26px;
}

.date {
    text-align: center;
    margin-bottom: 20px;
    color: #555;
}

.box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.player-row {
    background: #f8fbfd;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.batting-order {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

label {
    font-weight: bold;
}

select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: white;
}

button {
    width: 100%;
    padding: 14px;
    background: #0080c8;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    color: #008000;
}

.home-button {
    display: inline-block;
    padding: 10px 20px;
    margin-bottom: 15px;
    background-color: #0080c8;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.home-button:hover {
    opacity: 0.85;
}

</style>

</head>

<body>

<a href="index.html" class="home-button">
    🏠 HOMEに戻る
</a>

<div class="container">

<div class="header">

    <img
        src="logo.svg"
        alt="北海道日本ハムファイターズ"
        class="logo"
    >

    <h1>正解スタメン登録 ⚾</h1>

</div>

<div class="date" id="gameInfo">
    試合情報を読み込み中...
</div>

<div class="box">

    <h2>本日の正解スタメン</h2>

    <div id="players"></div>

    <p>※投手は採点対象外です</p>

</div>

<button
    id="saveButton"
    onclick="saveAnswer()"
>
    正解スタメンを登録する
</button>

<div id="message"></div>

</div>

<script>

// ==================================================
// GAS
// ==================================================

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxzMrd3EuNkf0bzze0s7sidnF8oTEbEuPvE3nrJ5oKMWCoirMgftWZezRgeSDiU1eqh2g/exec";


// ==================================================
// 選手一覧
// ==================================================

const playerGroups = {

    "捕手": [
        "マルティネス",
        "郡司裕也",
        "清水優心",
        "進藤勇也",
        "リン",
        "藤森海斗",
        "吉田賢吾",
        "田宮裕涼",
        "梅林優貴",
        "日渡騰輝"
    ],

    "内野手": [
        "上川畑大悟",
        "野村佑希",
        "カストロ",
        "中島卓也",
        "清宮幸太郎",
        "有薗直輝",
        "水野達稀",
        "阪口樂",
        "大塚瑠晏",
        "半田南十",
        "山縣秀",
        "細川凌平",
        "奈良間大己",
        "明瀬諒介",
        "常谷拓輝",
        "濵田泰希"
    ],

    "外野手": [
        "西川遥輝",
        "淺間大基",
        "宮崎一樹",
        "エドポロケイン",
        "五十幡亮汰",
        "水谷瞬",
        "今川優馬",
        "万波中正",
        "レイエス",
        "藤田大清",
        "山口アタル",
        "星野ひので"
    ],

    "投手": [
        "矢澤宏太",
        "生田目翼",
        "加藤貴之",
        "北山亘基",
        "達孝太",
        "伊藤大海",
        "山﨑福也",
        "玉井大翔",
        "上原健太",
        "金村尚真",
        "宮西尚生",
        "田中正義",
        "大川慈英",
        "河野竜生",
        "細野晴希",
        "ラオ",
        "柴田獅子",
        "藤田琉生",
        "堀瑞輝",
        "浅利太門",
        "古林睿煬",
        "島本浩也",
        "福谷浩司",
        "福島蓮",
        "畔柳亨丞",
        "柳川大晟",
        "齋藤友貴哉",
        "池田隆英",
        "菊地大稀",
        "清水大暉",
        "山城航太郎",
        "山本拓実",
        "有原航平",
        "松岡洸希",
        "清宮虎多朗",
        "孫易磊"
    ],

    "育成": [
        "加藤大和",
        "松本遼大",
        "川勝空人",
        "澁谷純希",
        "横山永遠",
        "福田俊",
        "安西叶翔",
        "根本悠楓"
    ]

};


// ==================================================
// 守備位置
// ==================================================

const positions = [
    "捕",
    "一",
    "二",
    "三",
    "遊",
    "左",
    "中",
    "右",
    "指"
];


// ==================================================
// 9人分の入力欄を作成
// ==================================================

const playersArea =
    document.getElementById("players");


for (let i = 0; i < 9; i++) {

    const row =
        document.createElement("div");

    row.className =
        "player-row";

    row.innerHTML = `

        <div class="batting-order">
            ${i + 1}番
        </div>

        <label>守備位置</label>

        <select class="position">

            <option value="">
                守備位置を選択してください
            </option>

            ${positions.map(function(position) {

                return `
                    <option value="${position}">
                        ${position}
                    </option>
                `;

            }).join("")}

        </select>


        <label>選手</label>

        <select class="player">

            <option value="">
                選手を選択してください
            </option>

            ${Object.entries(playerGroups).map(
                function([groupName, players]) {

                    return `

                        <optgroup label="${groupName}">

                            ${players.map(function(player) {

                                return `
                                    <option value="${player}">
                                        ${player}
                                    </option>
                                `;

                            }).join("")}

                        </optgroup>

                    `;

                }
            ).join("")}

        </select>

    `;

    playersArea.appendChild(row);

}


// ==================================================
// 今日の日付
// ==================================================

function getTodayString() {

    const today =
        new Date();

    return (
        today.getFullYear() +
        "-" +
        String(today.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(today.getDate()).padStart(2, "0")
    );

}


// ==================================================
// 正解スタメン登録
// ==================================================

function saveAnswer() {

    const rows =
        document.querySelectorAll(".player-row");

    const answer = [];


    // ----------------------------------------------
    // 9人分を取得
    // ----------------------------------------------

    rows.forEach(function(row, index) {

        const position =
            row.querySelector(".position").value;

        const player =
            row.querySelector(".player").value;


        answer.push({

            battingOrder:
                index + 1,

            position:
                position,

            player:
                player

        });

    });


    // ----------------------------------------------
    // 未入力チェック
    // ----------------------------------------------

    const incomplete =
        answer.some(function(item) {

            return (
                !item.position ||
                !item.player
            );

        });


    if (incomplete) {

        const message =
            document.getElementById("message");

        message.textContent =
            "⚠️ 9人すべての守備位置と選手を入力してください";

        message.style.color =
            "#d71920";

        return;

    }


    const todayString =
        getTodayString();


    const button =
        document.getElementById("saveButton");


    button.disabled = true;

    button.textContent =
        "登録中...";


    // ----------------------------------------------
    // GASへ保存
    // ----------------------------------------------

    fetch(
        GAS_URL +
        "?action=saveAnswer" +
        "&date=" +
        encodeURIComponent(todayString) +
        "&answer=" +
        encodeURIComponent(
            JSON.stringify(answer)
        )
    )

    .then(function(response) {

        return response.json();

    })

    .then(function(result) {

        if (!result.success) {

            throw new Error(
                "正解スタメンの保存に失敗しました"
            );

        }


        // ------------------------------------------
        // 登録成功
        // ------------------------------------------

        document.getElementById("message")
            .textContent =
            "✅ 正解スタメンを登録しました！";

        document.getElementById("message")
            .style.color =
            "#008000";


        document
            .querySelectorAll("select")
            .forEach(function(select) {

                select.disabled = true;

            });


        button.disabled =
            true;

        button.textContent =
            "✅ 本日の正解スタメン登録済み";

    })

    .catch(function(error) {

        console.error(
            "正解スタメン保存エラー",
            error
        );


        button.disabled =
            false;

        button.textContent =
            "正解スタメンを登録する";


        document.getElementById("message")
            .textContent =
            "⚠️ 正解スタメンの保存に失敗しました";

        document.getElementById("message")
            .style.color =
            "#d71920";

    });

}


// ==================================================
// 今日の正解スタメンをGASから読み込む
// ==================================================

function loadTodayAnswer() {

    const todayString =
        getTodayString();


    fetch(
        GAS_URL +
        "?action=getAnswer" +
        "&date=" +
        encodeURIComponent(todayString)
    )

    .then(function(response) {

        return response.json();

    })

    .then(function(answer) {

        if (
            !Array.isArray(answer) ||
            answer.length === 0
        ) {

            return;

        }


        const rows =
            document.querySelectorAll(".player-row");


        answer.forEach(function(item) {

            const index =
                Number(item.battingOrder) - 1;


            if (!rows[index]) {
                return;
            }


            rows[index]
                .querySelector(".position")
                .value =
                item.position || "";


            rows[index]
                .querySelector(".player")
                .value =
                item.player || "";

        });


        // ------------------------------------------
        // 登録済み
        // ------------------------------------------

        document
            .querySelectorAll("select")
            .forEach(function(select) {

                select.disabled = true;

            });


        const button =
            document.getElementById("saveButton");


        button.disabled =
            true;

        button.textContent =
            "✅ 本日の正解スタメン登録済み";


        document.getElementById("message")
            .textContent =
            "本日の正解スタメンは登録済みです。";

        document.getElementById("message")
            .style.color =
            "#008000";

    })

    .catch(function(error) {

        console.error(
            "正解スタメン取得エラー",
            error
        );

    });

}


// ==================================================
// 試合情報取得
// ==================================================

fetch(GAS_URL)

    .then(function(response) {

        return response.json();

    })

    .then(function(games) {

        const todayString =
            getTodayString();


        const todayGame =
            games.find(function(game) {

                return (
                    game.date === todayString
                );

            });


        const gameInfo =
            document.getElementById("gameInfo");


        if (!todayGame) {

            gameInfo.innerHTML =
                "本日の試合情報はありません";

            return;

        }


        const date =
            new Date(
                todayGame.date +
                "T00:00:00"
            );


        const weekdays = [
            "日",
            "月",
            "火",
            "水",
            "木",
            "金",
            "土"
        ];


        gameInfo.innerHTML = `

            <strong>

                ${date.getFullYear()}年
                ${date.getMonth() + 1}月
                ${date.getDate()}日
                （${weekdays[date.getDay()]}）

            </strong>

            <br><br>

            北海道日本ハムファイターズ

            <br>

            VS

            <br>

            ${todayGame.opponent}

            <br><br>

            📍 ${todayGame.stadium}

            <br>

            🕐 ${todayGame.time}

            <div style="
                background:#d71920;
                color:white;
                padding:10px;
                border-radius:8px;
                margin-top:12px;
                font-weight:bold;
            ">

                ⏰ 正解スタメン登録

            </div>

        `;

    })

    .catch(function(error) {

        console.error(
            "試合情報の取得に失敗しました",
            error
        );


        document.getElementById("gameInfo")
            .textContent =
            "試合情報を取得できませんでした";

    });


// ==================================================
// 今日の正解スタメンを確認
// ==================================================

loadTodayAnswer();

</script>

</body>
</html>
