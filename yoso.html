<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタメン予想</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      padding-bottom: 390px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      background: #0080c8;
      color: white;
      text-align: center;
      padding: 18px 10px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .logo {
      width: 180px;
      max-width: 80%;
    }

    h1 {
      margin: 8px 0 0;
      color: white;
      font-size: 28px;
    }

    .date {
      text-align: center;
      margin-bottom: 20px;
      color: #555;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    label {
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: white;
    }

    select:disabled {
      background: #eeeeee;
      color: #777;
    }

    .player-row {
      background: #f8fbfd;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .batting-order {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0080c8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #008000;
    }

    .home-button {
      display: inline-block;
      padding: 10px 20px;
      margin-bottom: 15px;
      background-color: #0080c8;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .home-button:hover {
      opacity: 0.85;
    }


    /* =========================
       現在の予想 固定パネル
       ========================= */

    .preview-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 3px solid #0080c8;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.15);
      z-index: 1000;
      max-height: 42vh;
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      background: #0080c8;
      color: white;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .preview-header-title {
      font-size: 17px;
      font-weight: bold;
    }

    .preview-toggle {
      font-size: 20px;
      font-weight: bold;
    }

    .preview-content {
      overflow-y: auto;
      padding: 5px 15px 12px;
    }

    .preview-row {
      display: flex;
      align-items: center;
      min-height: 30px;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }

    .preview-row:last-child {
      border-bottom: none;
    }

    .preview-number {
      width: 35px;
      font-weight: bold;
    }

    .preview-position {
      width: 40px;
      font-weight: bold;
      text-align: center;
    }

    .preview-player {
      flex: 1;
      font-weight: bold;
      padding-left: 8px;
    }

    .not-selected {
      color: #aaa;
      font-weight: normal;
    }

    .warning {
      background: #fff3cd;
      color: #856404;
      padding: 8px 10px;
      border-radius: 8px;
      margin: 8px 0 0;
      font-weight: bold;
      font-size: 13px;
    }

    /* パネルを閉じた状態 */

    .preview-panel.collapsed {
      max-height: none;
    }

    .preview-panel.collapsed .preview-content {
      display: none;
    }


    /* スマホ用 */

    @media (max-width: 600px) {

      body {
        padding: 12px;
        padding-bottom: 330px;
      }

      .header {
        padding: 14px 8px;
      }

      h1 {
        font-size: 24px;
      }

      .logo {
        width: 150px;
      }

      .preview-panel {
        max-height: 45vh;
      }

      .preview-header {
        padding: 9px 12px;
      }

      .preview-content {
        padding: 3px 12px 8px;
      }

      .preview-row {
        min-height: 27px;
        font-size: 14px;
      }

      .preview-number {
        width: 30px;
      }

      .preview-position {
        width: 35px;
      }

    }

  </style>

</head>

<body>

<a href="index.html" class="home-button">🏠 HOMEに戻る</a>

  <div class="container">


<div class="header">

  <img src="logo.svg"
       alt="北海道日本ハムファイターズ"
       class="logo">

  <h1>スタメン予想 ⚾️</h1>

</div>

<div class="date" id="gameInfo">
  試合情報を読み込み中...
</div>

<div class="box">

  <label>予想する人</label>

  <select id="member">
    <option value="ともき" selected>ともき</option>
    <option value="えりか">えりか</option>
    <option value="ほのか">ほのか</option>
    <option value="ゆな">ゆな</option>
  </select>

</div>

<div class="box">

  <h2>スタメン予想を入力</h2>

  <div id="players"></div>

  <p>※投手は採点対象外です</p>

</div>

<button onclick="savePrediction()">
  予想を登録する
</button>

<div id="message"></div>


  </div>

  <!-- =========================
       現在の予想 固定パネル
       ========================= -->

  <div class="preview-panel" id="previewPanel">


<div class="preview-header" onclick="togglePreview()">

  <div class="preview-header-title">
    ⚾ 現在の予想
  </div>

  <div class="preview-toggle" id="previewToggle">
    ▼
  </div>

</div>

<div class="preview-content">

  <div id="duplicateWarning"></div>

  <div id="preview"></div>

</div>

  </div>

<script>

const playerGroups = {

  "捕手": [
    "マルティネス",
    "郡司裕也",
    "清水優心",
    "進藤勇也",
    "リン",
    "藤森海斗",
    "吉田賢吾",
    "田宮裕涼",
    "梅林優貴",
    "日渡騰輝"
  ],

  "内野手": [
    "上川畑大悟",
    "野村佑希",
    "カストロ",
    "中島卓也",
    "清宮幸太郎",
    "有薗直輝",
    "水野達稀",
    "阪口樂",
    "大塚瑠晏",
    "半田南十",
    "山縣秀",
    "細川凌平",
    "奈良間大己",
    "明瀬諒介",
    "常谷拓輝",
    "濵田泰希"
  ],

  "外野手": [
    "西川遥輝",
    "淺間大基",
    "宮崎一樹",
    "エドポロケイン",
    "五十幡亮汰",
    "水谷瞬",
    "今川優馬",
    "万波中正",
    "レイエス",
    "藤田大清",
    "山口アタル",
    "星野ひので"
  ],

  "投手": [
    "矢澤宏太",
    "生田目翼",
    "加藤貴之",
    "北山亘基",
    "達孝太",
    "伊藤大海",
    "山﨑福也",
    "玉井大翔",
    "上原健太",
    "金村尚真",
    "宮西尚生",
    "田中正義",
    "大川慈英",
    "河野竜生",
    "細野晴希",
    "ラオ",
    "柴田獅子",
    "藤田琉生",
    "堀瑞輝",
    "浅利太門",
    "古林睿煬",
    "島本浩也",
    "福谷浩司",
    "福島蓮",
    "畔柳亨丞",
    "柳川大晟",
    "齋藤友貴哉",
    "池田隆英",
    "菊地大稀",
    "清水大暉",
    "山城航太郎",
    "山本拓実",
    "有原航平",
    "松岡洸希",
    "清宮虎多朗",
    "孫易磊"
  ],

  "育成": [
    "加藤大和",
    "松本遼大",
    "川勝空人",
    "澁谷純希",
    "横山永遠",
    "福田俊",
    "安西叶翔",
    "根本悠楓"
  ]

};


const positions = [
  "捕",
  "一",
  "二",
  "三",
  "遊",
  "左",
  "中",
  "右",
  "指"
];


const playersArea =
  document.getElementById("players");


for (let i = 0; i < 9; i++) {

  const row =
    document.createElement("div");

  row.className =
    "player-row";

  row.innerHTML = `

    <div class="batting-order">
      ${i + 1}番
    </div>

    <label>守備位置</label>

    <select class="position">

      <option value="" selected>
        守備位置を選択してください
      </option>

      ${positions.map(position =>
        `<option value="${position}">
          ${position}
        </option>`
      ).join("")}

    </select>

    <label>選手</label>

    <select class="player">

      <option value="" selected>
        選手を選択してください
      </option>

      ${Object.entries(playerGroups).map(
        ([groupName, players]) => `

        <optgroup label="${groupName}">

          ${players.map(player =>
            `<option value="${player}">
              ${player}
            </option>`
          ).join("")}

        </optgroup>

      `).join("")}

    </select>

  `;

  playersArea.appendChild(row);
}


// =========================
// 現在の予想を更新
// =========================

function updatePreview() {

  const rows =
    document.querySelectorAll(".player-row");

  const preview =
    document.getElementById("preview");

  const selectedPlayers = [];

  let html = "";


  rows.forEach((row, index) => {

  const position =
    row.querySelector(".position").value;

  const player =
    row.querySelector(".player").value;


  if (player) {
    selectedPlayers.push(player);
  }


  html += `

    <div class="preview-row" data-player="${player}">

      <div class="preview-number">
        ${index + 1}
      </div>

      <div class="preview-position">
        ${position || "－"}
      </div>

      <div class="preview-player
        ${player ? "" : "not-selected"}">

        ${player || "選手未選択"}

      </div>

    </div>

  `;

});


  preview.innerHTML = html;


  // 重複チェック

  const duplicates =
    selectedPlayers.filter(
      (player, index) =>
        selectedPlayers.indexOf(player) !== index
    );


  const warning =
    document.getElementById("duplicateWarning");


  if (duplicates.length > 0) {

    const uniqueDuplicates =
      [...new Set(duplicates)];

    warning.innerHTML = `
      <div class="warning">
        ⚠️ 同じ選手が複数の打順に選択されています：<br>
        ${uniqueDuplicates.join("、")}
      </div>
    `;

  } else {

    warning.innerHTML = "";

  }

}


// =========================
// 入力変更時に即更新
// =========================

document.addEventListener(
  "change",
  function(event) {

    if (
      event.target.classList.contains("position") ||
      event.target.classList.contains("player")
    ) {

      updatePreview();

    }

  }
);


// =========================
// パネル開閉
// =========================

function togglePreview() {

  const panel =
    document.getElementById("previewPanel");

  const toggle =
    document.getElementById("previewToggle");


  panel.classList.toggle("collapsed");


  if (panel.classList.contains("collapsed")) {

    toggle.textContent = "▲";

  } else {

    toggle.textContent = "▼";

  }

}


// 最初から表示
updatePreview();

// =========================
// 今日登録した予想を読み込む
// =========================

// =========================
// 今日登録した予想を読み込む
// =========================

function loadTodayPrediction() {

  const member =
    document.getElementById("member").value;

  if (!member) return;

  const saved =
    localStorage.getItem(
      "fightersPrediction_" + member
    );

  if (!saved) return;

  let data;

  try {

    data = JSON.parse(saved);

  } catch (error) {

    console.error(
      "予想データの読み込みに失敗しました",
      error
    );

    return;

  }

  // =========================
  // 新しい保存形式
  // =========================

  let prediction = null;

  if (
    data &&
    !Array.isArray(data) &&
    data.prediction
  ) {

    const today =
      new Date();

    const todayString =
      today.getFullYear() + "-" +
      String(today.getMonth() + 1).padStart(2, "0") + "-" +
      String(today.getDate()).padStart(2, "0");

    // 今日のデータだけ読み込む
    if (data.date === todayString) {

      prediction =
        data.prediction;

    }

  }

  // =========================
  // 旧い保存形式
  // =========================

  if (Array.isArray(data)) {

    prediction = data;

  }

  // 読み込める予想がなければ終了
  if (!prediction) return;

  const rows =
    document.querySelectorAll(".player-row");

  prediction.forEach(function(item, index) {

    if (!rows[index]) return;

    rows[index].querySelector(".position").value =
      item.position || "";

    rows[index].querySelector(".player").value =
      item.player || "";

  });

  updatePreview();

}

// =========================
// 予想を保存
// =========================

function savePrediction() {

  const member =
    document.getElementById("member").value;

  const rows =
    document.querySelectorAll(".player-row");

  const prediction = [];

  rows.forEach((row, index) => {

    const position =
      row.querySelector(".position").value;

    const player =
      row.querySelector(".player").value;

    prediction.push({

      battingOrder: index + 1,

      position: position,

      player: player

    });

  });


  const today =
    new Date();

  const todayString =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");


  const data = {

    member: member,

    date: todayString,

    prediction: prediction,

    savedAt: new Date().toISOString()

  };


  // =========================
  // 今までの保存も残す
  // =========================

  localStorage.setItem(
    "fightersPrediction_" + member,
    JSON.stringify(data)
  );


  // =========================
  // Googleスプレッドシートへ保存
  // =========================

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxzMrd3EuNkf0bzze0s7sidnF8oTEbEuPvE3nrJ5oKMWCoirMgftWZezRgeSDiU1eqh2g/exec";


  fetch(
    GAS_URL +
    "?action=savePrediction" +
    "&date=" + encodeURIComponent(todayString) +
    "&member=" + encodeURIComponent(member) +
    "&prediction=" + encodeURIComponent(
      JSON.stringify(prediction)
    )
  )
  .then(response => response.json())
  .then(result => {

    if (result.success) {

      document.getElementById("message").textContent =
        "✅ 予想を登録しました！";

    }

  })
  .catch(error => {

    console.error(
      "予想データの保存に失敗しました",
      error
    );

    document.getElementById("message").textContent =
      "⚠️ 予想を登録しましたが、共有保存に失敗しました";

  });


  loadTodayPrediction();

}


const GAS_URL =
"https://script.google.com/macros/s/AKfycbxzMrd3EuNkf0bzze0s7sidnF8oTEbEuPvE3nrJ5oKMWCoirMgftWZezRgeSDiU1eqh2g/exec";


fetch(GAS_URL)

  .then(response =>
    response.json()
  )

  .then(games => {

    const today =
      new Date();

    const todayString =
      today.getFullYear() + "-" +
      String(today.getMonth() + 1).padStart(2, "0") + "-" +
      String(today.getDate()).padStart(2, "0");


    const todayGame =
      games.find(
        game => game.date === todayString
      );


    const gameInfo =
      document.getElementById("gameInfo");


    if (!todayGame) {

      gameInfo.innerHTML = `
        本日の試合情報はありません
      `;

      return;
    }


    const date =
      new Date(
        todayGame.date + "T00:00:00"
      );


    const weekdays =
      ["日", "月", "火", "水", "木", "金", "土"];


    const gameStart =
      new Date(
        todayGame.date +
        "T" +
        todayGame.time +
        ":00+09:00"
      );


    const deadline =
      new Date(
        gameStart.getTime() -
        2 * 60 * 60 * 1000
      );


    const now =
      new Date();


    const isClosed =
      now >= deadline;


    const deadlineTime =
      String(
        deadline.getHours()
      ).padStart(2, "0") +
      ":" +
      String(
        deadline.getMinutes()
      ).padStart(2, "0");


    gameInfo.innerHTML = `

      <strong>

        ${date.getFullYear()}年
        ${date.getMonth() + 1}月
        ${date.getDate()}日
        （${weekdays[date.getDay()]}）

      </strong>

      <br><br>

      北海道日本ハムファイターズ

      <br>

      VS

      <br>

      ${todayGame.opponent}

      <br><br>

      📍 ${todayGame.stadium}

      <br>

      🕐 ${todayGame.time}

      <div style="
        background:${isClosed ? "#777" : "#d71920"};
        color:white;
        padding:10px;
        border-radius:8px;
        margin-top:12px;
        font-weight:bold;
      ">

        ${isClosed
          ? "⛔ 予想受付終了"
          : "⏰ 予想締切：" + deadlineTime
        }

      </div>

    `;


    // 締切後なら入力欄を無効化

    if (isClosed) {

      document
        .querySelectorAll("select")
        .forEach(function(select) {

          select.disabled = true;

        });


      const saveButton =
        document.querySelector(
          'button[onclick="savePrediction()"]'
        );


      if (saveButton) {

        saveButton.disabled = true;

        saveButton.style.background =
          "#999";

        saveButton.style.cursor =
          "not-allowed";

        saveButton.textContent =
          "⛔ 予想受付終了";

      }


      document.getElementById("message")
        .textContent =
        "本日のスタメン予想受付は終了しました。";

      document.getElementById("message")
        .style.color =
        "#d71920";

    }

  })

  .catch(error => {

    console.error(
      "試合情報の取得に失敗しました",
      error
    );


    document.getElementById("gameInfo")
      .textContent =
      "試合情報を取得できませんでした";

  });

document.getElementById("member")
  .addEventListener("change", function() {

    loadTodayPrediction();

  });

  loadTodayPrediction();

</script>

</body>
</html>
