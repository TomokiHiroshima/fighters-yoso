<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>北海道日本ハムファイターズ スタメン予想</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #0080c8;
      color: white;
      text-align: center;
      padding: 20px 10px;
    }

    .logo {
      width: 220px;
      max-width: 80%;
    }

    header h2 {
      margin: 8px 0 0;
      font-size: 28px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }

    .game-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .date {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .match {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.6;
    }

    .stadium {
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .deadline {
      background: #d71920;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
    }

    .ranking-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .ranking-card h3 {
      margin-top: 0;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
    }

    .ranking {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .ranking:last-child {
      border-bottom: none;
    }

    .predict-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #0080c8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .predict-button:hover {
      opacity: 0.85;
    }

    /* 本日のスタメン */

    .lineup-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .lineup-card h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    #todayLineupList {
      margin-bottom: 10px;
    }

    .lineup-row {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    .lineup-row:last-child {
      border-bottom: none;
    }

  </style>
</head>

<body>

  <header>

    <img
      src="logo.svg"
      alt="北海道日本ハムファイターズ"
      class="logo"
    >

    <h2>スタメン予想 ⚾</h2>

  </header>


  <div class="container">


    <!-- =========================
         試合情報
    ========================= -->

    <div class="game-card" id="gameInfo">

      <div class="date">
        試合情報を読み込み中...
      </div>

    </div>


    <!-- =========================
         現在のランキング
    ========================= -->

    <div class="ranking-card">

      <h3>🏆 現在のランキング</h3>

      <div id="ranking">

        <p>
          ランキングを読み込み中…
        </p>

      </div>

    </div>


    <!-- =========================
         本日のスタメン
    ========================= -->

    <div
      class="lineup-card"
      id="todayLineup"
      style="display:none;"
    >

      <h2>
        ⚾ 本日のスタメン
      </h2>

      <div id="todayLineupList"></div>

    </div>


    <!-- =========================
         ボタン
    ========================= -->

    <button
      class="predict-button"
      onclick="location.href='yoso.html'"
    >
      スタメンを予想する ⚾
    </button>


    <button
      class="predict-button"
      onclick="location.href='kakunin.html'"
      style="margin-top: 10px;"
    >
      みんなの予想を確認する 📊
    </button>


    <button
      class="predict-button"
      onclick="location.href='seikai.html'"
      style="margin-top: 10px;"
    >
      正解スタメンを入力する ✅
    </button>


  </div>


<script>


// ==================================================
// GAS
// ==================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxzMrd3EuNkf0bzze0s7sidnF8oTEbEuPvE3nrJ5oKMWCoirMgftWZezRgeSDiU1eqh2g/exec";


// ==================================================
// 今日の日付
// ==================================================

const today =
  new Date();

const todayString =
  today.getFullYear() + "-" +
  String(today.getMonth() + 1).padStart(2, "0") + "-" +
  String(today.getDate()).padStart(2, "0");


// ==================================================
// メンバー
// ==================================================

const members = [
  "ともき",
  "えりか",
  "ほのか",
  "ゆな"
];


// ==================================================
// 試合情報
// ==================================================

fetch(GAS_URL)

  .then(function(response) {

    return response.json();

  })

  .then(function(games) {

    const todayGame =
      games.find(function(game) {

        return game.date === todayString;

      });


    const gameInfo =
      document.getElementById("gameInfo");


    if (!todayGame) {

      gameInfo.innerHTML = `
        <div class="date">
          本日の試合情報はありません
        </div>
      `;

      return;

    }


    const date =
      new Date(
        todayGame.date + "T00:00:00"
      );


    const weekdays = [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];


    console.log(
      "試合開始時刻:",
      todayGame.time
    );


    // =========================
    // 締切時刻
    // 試合開始90分前
    // =========================

    const gameDateTime =
      new Date(
        todayGame.date +
        "T" +
        todayGame.time +
        ":00"
      );


    const deadlineDateTime =
      new Date(
        gameDateTime.getTime() -
        90 * 60 * 1000
      );


    const deadlineText =
      `${deadlineDateTime.getMonth() + 1}月` +
      `${deadlineDateTime.getDate()}日 ` +
      `${String(deadlineDateTime.getHours()).padStart(2, "0")}:` +
      `${String(deadlineDateTime.getMinutes()).padStart(2, "0")}`;


    gameInfo.innerHTML = `

      <div class="date">

        ${date.getFullYear()}年
        ${date.getMonth() + 1}月
        ${date.getDate()}日
        （${weekdays[date.getDay()]}）

      </div>


      <div class="match">

        北海道日本ハムファイターズ<br>

        VS<br>

        ${todayGame.opponent}

      </div>


      <div class="stadium">

        📍 ${todayGame.stadium}<br>

        🕐 ${todayGame.time}

      </div>


      <div class="deadline">

        ⏰ 予想締切：${deadlineText}

      </div>

    `;

  })

  .catch(function(error) {

    console.error(
      "試合情報の取得に失敗しました",
      error
    );


    document.getElementById(
      "gameInfo"
    ).innerHTML = `

      <div class="date">

        試合情報を取得できませんでした

      </div>

    `;

  });


// ==================================================
// 本日の正解スタメンをGASから取得
// ==================================================

fetch(
  GAS_URL +
  "?action=getAnswer" +
  "&date=" +
  encodeURIComponent(todayString)
)

  .then(function(response) {

    return response.json();

  })

  .then(function(answer) {

    if (
      !Array.isArray(answer) ||
      answer.length === 0
    ) {

      return;

    }


    const lineupArea =
      document.getElementById(
        "todayLineup"
      );


    const lineupList =
      document.getElementById(
        "todayLineupList"
      );


    if (!lineupArea || !lineupList) {

      return;

    }


    lineupList.innerHTML = "";


    answer
      .sort(function(a, b) {

        return a.battingOrder -
               b.battingOrder;

      })
      .forEach(function(player) {

        const row =
          document.createElement("div");


        row.className =
          "lineup-row";


        row.textContent =
          player.battingOrder +
          "番　" +
          player.position +
          "　" +
          player.player;


        lineupList.appendChild(row);

      });


    lineupArea.style.display =
      "block";

  })

  .catch(function(error) {

    console.error(
      "正解スタメンの取得に失敗しました",
      error
    );

  });


// ==================================================
// 累計ランキングをGASから取得
// ==================================================

fetch(
  GAS_URL +
  "?action=getRanking"
)

  .then(function(response) {

    return response.json();

  })

  .then(function(ranking) {

    const rankingElement =
      document.getElementById(
        "ranking"
      );


    if (!rankingElement) {

      return;

    }


    // =========================
    // 4人全員を表示
    // =========================

    const rankingMap = {};


    if (Array.isArray(ranking)) {

      ranking.forEach(function(item) {

        rankingMap[item.member] =
          Number(item.points) || 0;

      });

    }


    // GASの順位順を利用
    // 同点の場合もGASの順番をそのまま表示

    let rankingHtml = "";


    if (Array.isArray(ranking) && ranking.length > 0) {

      ranking.forEach(function(item, index) {

        const points =
          Number(item.points) || 0;


        rankingHtml += `

          <div class="ranking">

            <span>
              ${index + 1}位　${item.member}
            </span>

            <strong>
              ${points}点
            </strong>

          </div>

        `;

      });

    } else {

      // データがまだない場合

      members.forEach(function(member, index) {

        rankingHtml += `

          <div class="ranking">

            <span>
              ${index + 1}位　${member}
            </span>

            <strong>
              0点
            </strong>

          </div>

        `;

      });

    }


    rankingElement.innerHTML =
      rankingHtml;

  })

  .catch(function(error) {

    console.error(
      "ランキングの取得に失敗しました",
      error
    );


    const rankingElement =
      document.getElementById(
        "ranking"
      );


    if (rankingElement) {

      rankingElement.innerHTML = `

        <p>
          ランキングを取得できませんでした
        </p>

      `;

    }

  });


</script>

</body>
</html>
