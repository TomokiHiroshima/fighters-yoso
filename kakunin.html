<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>予想確認</title>

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.header {
    background: #0080c8;
    color: white;
    text-align: center;
    padding: 18px 10px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.logo {
    width: 180px;
    max-width: 80%;
}

.header h1 {
    margin: 8px 0 0;
    color: white;
    font-size: 28px;
}

.date {
    text-align: center;
    margin-bottom: 20px;
    color: #555;
}

.member {
    background: white;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.member h2 {
    margin-top: 0;
    margin-bottom: 12px;
    color: #333;
    font-size: 20px;
}

.row {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 16px;
}

.row:last-child {
    border-bottom: none;
}

.order {
    width: 50px;
    font-size: 18px;
    font-weight: bold;
    color: #0080c8;
}

.position {
    width: 55px;
    font-size: 16px;
    font-weight: bold;
    color: #555;
}

.player {
    font-size: 18px;
    font-weight: bold;
    color: #222;
}

.no-data {
    color: #888;
    margin-bottom: 0;
}

.prediction-title {
    font-size: 14px;
    font-weight: bold;
    color: #888;
    margin-bottom: 5px;
}

.comparison-table {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.comparison-row {
    display: grid;
    grid-template-columns: 55px repeat(4, 1fr);
    border-bottom: 1px solid #eee;
}

.comparison-row:last-child {
    border-bottom: none;
}

.comparison-row > div {
    padding: 10px 5px;
    text-align: center;
    border-right: 1px solid #eee;
    font-size: 14px;
}

.comparison-row > div:last-child {
    border-right: none;
}

.comparison-row.header {
    font-weight: bold;
    background: #0080c8;
    color: white;
}

.comparison-row:not(.header) > div:first-child {
    font-weight: bold;
    color: #0080c8;
}

.same-player {
    font-weight: bold;
    background: #e8f6ff;
}

.correct-answer {
    font-weight: bold;
    background: #d9f2ff;
    color: #0080c8;
}

.comparison-note {
    color: #888;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 10px;
}

.refresh-button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: none;
    border-radius: 10px;
    background: #0080c8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.home-button {
    display: inline-block;
    padding: 10px 20px;
    margin-bottom: 15px;
    background-color: #0080c8;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.home-button:hover {
    opacity: 0.85;
}

.score-box {
    background: #f8fbfd;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.score-number {
    font-size: 24px;
    font-weight: bold;
    color: #0080c8;
}

.ranking-note {
    color: #888;
    font-size: 13px;
    margin-top: -5px;
}

</style>

</head>

<body>

<a href="index.html" class="home-button">
    🏠 HOMEに戻る
</a>

<div class="container">

<div class="header">

    <img
        src="logo.svg"
        alt="北海道日本ハムファイターズ"
        class="logo"
    >

    <h1>予想確認 ⚾️</h1>

</div>

<div class="date" id="gameInfo">
    試合情報を読み込み中...
</div>

<button
    onclick="location.reload()"
    class="refresh-button"
>
    🔄 最新の予想に更新
</button>

<div id="comparison"></div>

<div id="result"></div>

</div>

<script>

// ==================================================
// GAS
// ==================================================

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxzMrd3EuNkf0bzze0s7sidnF8oTEbEuPvE3nrJ5oKMWCoirMgftWZezRgeSDiU1eqh2g/exec";


// ==================================================
// メンバー
// ==================================================

const members = [
    "ともき",
    "えりか",
    "ほのか",
    "ゆな"
];


// ==================================================
// 今日の日付
// ==================================================

const today =
    new Date();

const todayString =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");


// ==================================================
// 表示エリア
// ==================================================

const result =
    document.getElementById("result");

const comparison =
    document.getElementById("comparison");


// ==================================================
// みんなの予想データ
// ==================================================

let comparisonData = {};

members.forEach(function(member) {

    comparisonData[member] = {};

});


// ==================================================
// 正解スタメン
// ==================================================

let answer = [];


// ==================================================
// 累計ランキング
// ==================================================

let rankingData = [];


// ==================================================
// 3つのデータをGASから取得
// ==================================================

Promise.all([

    fetch(
        GAS_URL +
        "?action=getPredictions"
    ).then(function(response) {

        return response.json();

    }),

    fetch(
        GAS_URL +
        "?action=getAnswer" +
        "&date=" +
        encodeURIComponent(todayString)
    ).then(function(response) {

        return response.json();

    }),

    fetch(
        GAS_URL +
        "?action=getRanking"
    ).then(function(response) {

        return response.json();

    })

])

.then(function(results) {

    const predictions =
        results[0];

    answer =
        Array.isArray(results[1])
            ? results[1]
            : [];

    rankingData =
        Array.isArray(results[2])
            ? results[2]
            : [];


    // ==================================================
    // 今日の予想だけをメンバー別に整理
    // ==================================================

    predictions.forEach(function(item) {

        if (
            String(item.date) !==
            String(todayString)
        ) {

            return;

        }


        if (
            !members.includes(item.member)
        ) {

            return;

        }


        comparisonData[item.member][
            Number(item.battingOrder)
        ] = {

            player:
                item.player,

            position:
                item.position

        };

    });


    // ==================================================
    // 現在の累計ランキング
    // ==================================================

    let rankingHtml = `

        <div class="member">

            <h2>🏆 現在のランキング</h2>

    `;


    if (
        rankingData.length === 0
    ) {

        members.forEach(function(member, index) {

            rankingHtml += `

                <div class="row">

                    <div class="order">
                        ${index + 1}位
                    </div>

                    <div class="player">
                        ${member}
                    </div>

                    <div class="position">
                        0点
                    </div>

                </div>

            `;

        });

    } else {

        rankingData.forEach(function(item, index) {

            rankingHtml += `

                <div class="row">

                    <div class="order">
                        ${index + 1}位
                    </div>

                    <div class="player">
                        ${item.member}
                    </div>

                    <div class="position">
                        ${Number(item.points) || 0}点
                    </div>

                </div>

            `;

        });

    }


    rankingHtml += `

        </div>

    `;


    result.innerHTML =
        rankingHtml;


    // ==================================================
    // みんなの予想比較
    // ==================================================

    let comparisonHtml = `

        <h2>📊 みんなの予想を比較</h2>

        <p class="comparison-note">
            同じ選手を予想しているところが分かります
        </p>

        <div class="comparison-table">

            <div class="comparison-row header">

                <div>打順</div>
                <div>ともき</div>
                <div>えりか</div>
                <div>ほのか</div>
                <div>ゆな</div>

            </div>

    `;


    for (
        let i = 1;
        i <= 9;
        i++
    ) {

        const predictionsAtOrder =
            members.map(function(member) {

                return comparisonData[member][i];

            });


        const playerNames =
            predictionsAtOrder.map(function(data) {

                return data
                    ? data.player
                    : null;

            });


        comparisonHtml += `

            <div class="comparison-row">

                <div>${i}番</div>

        `;


        predictionsAtOrder.forEach(function(data) {

            if (!data) {

                comparisonHtml += `
                    <div>-</div>
                `;

                return;

            }


            const count =
                playerNames.filter(function(name) {

                    return (
                        name &&
                        name === data.player
                    );

                }).length;


            let className = "";


            // ==================================================
            // 同じ選手を予想
            // ==================================================

            if (count >= 2) {

                className =
                    "same-player";

            }


            // ==================================================
            // 正解
            // 正解した場合はこちらを優先
            // ==================================================

            if (answer.length > 0) {

                const correct =
                    answer.find(function(item) {

                        return (

                            Number(item.battingOrder) === i &&

                            String(item.player) ===
                            String(data.player) &&

                            String(item.position) ===
                            String(data.position)

                        );

                    });


                if (correct) {

                    className =
                        "correct-answer";

                }

            }


            comparisonHtml += `

                <div class="${className}">

                    <strong>
                        ${data.position}
                    </strong>

                    <br>

                    ${data.player}

                </div>

            `;

        });


        comparisonHtml += `

            </div>

        `;

    }


    comparisonHtml += `

        </div>

    `;


    comparison.innerHTML =
        comparisonHtml;


    // ==================================================
    // 各メンバーの詳細予想
    // ==================================================

    members.forEach(function(member) {

        const box =
            document.createElement("div");


        box.className =
            "member";


        const memberData =
            comparisonData[member];


        const battingOrders =
            Object.keys(memberData);


        if (
            battingOrders.length > 0
        ) {

            let html = `

                <h2>👤 ${member}</h2>

                <div class="prediction-title">
                    予想スタメン
                </div>

            `;


            battingOrders
                .sort(function(a, b) {

                    return Number(a) -
                           Number(b);

                })
                .forEach(function(order) {

                    const player =
                        memberData[order];


                    let rowClass = "";


                    // ==================================================
                    // 正解ハイライト
                    // ==================================================

                    if (answer.length > 0) {

                        const correct =
                            answer.find(function(item) {

                                return (

                                    Number(item.battingOrder) ===
                                    Number(order) &&

                                    String(item.player) ===
                                    String(player.player) &&

                                    String(item.position) ===
                                    String(player.position)

                                );

                            });


                        if (correct) {

                            rowClass =
                                "correct-answer";

                        }

                    }


                    html += `

                        <div
                            class="row ${rowClass}"
                        >

                            <div class="order">
                                ${order}番
                            </div>

                            <div class="position">
                                ${player.position || "-"}
                            </div>

                            <div class="player">
                                ${player.player || "-"}
                            </div>

                        </div>

                    `;

                });


            box.innerHTML =
                html;

        } else {

            box.innerHTML = `

                <h2>👤 ${member}</h2>

                <p class="no-data">
                    まだ今日の予想が登録されていません。
                </p>

            `;

        }


        result.appendChild(box);

    });

})

.catch(function(error) {

    console.error(
        "データ取得エラー",
        error
    );


    comparison.innerHTML = `

        <div class="member">

            <p class="no-data">
                データを取得できませんでした。
            </p>

        </div>

    `;

});


// ==================================================
// 試合情報
// ==================================================

fetch(GAS_URL)

    .then(function(response) {

        return response.json();

    })

    .then(function(games) {

        const todayGame =
            games.find(function(game) {

                return game.date === todayString;

            });


        const gameInfo =
            document.getElementById("gameInfo");


        if (!todayGame) {

            gameInfo.innerHTML =
                "本日の試合情報はありません";

            return;

        }


        const date =
            new Date(
                todayGame.date +
                "T00:00:00"
            );


        const weekdays = [
            "日",
            "月",
            "火",
            "水",
            "木",
            "金",
            "土"
        ];


        gameInfo.innerHTML = `

            <strong>

                ${date.getFullYear()}年
                ${date.getMonth() + 1}月
                ${date.getDate()}日
                （${weekdays[date.getDay()]}）

            </strong>

            <br><br>

            北海道日本ハムファイターズ

            <br>

            VS

            <br>

            ${todayGame.opponent}

            <br><br>

            📍 ${todayGame.stadium}

            <br>

            🕐 ${todayGame.time}

        `;

    })

    .catch(function(error) {

        console.error(
            "試合情報の取得に失敗しました",
            error
        );


        document.getElementById("gameInfo")
            .textContent =
            "試合情報を取得できませんでした";

    });

</script>

</body>
</html>
