<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>予想確認</title>

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.header {
    background: #0080c8;
    color: white;
    text-align: center;
    padding: 18px 10px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.logo {
    width: 180px;
    max-width: 80%;
}

.header h1 {
    margin: 8px 0 0;
    color: white;
    font-size: 28px;
}

.date {
    text-align: center;
    margin-bottom: 20px;
    color: #555;
}

.member {
    background: white;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.member h2 {
    margin-top: 0;
    margin-bottom: 12px;
    color: #333;
    font-size: 20px;
}

.row {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 16px;
}

.row:last-child {
    border-bottom: none;
}

.order {
    width: 50px;
    font-size: 18px;
    font-weight: bold;
    color: #0080c8;
}

.position {
    width: 55px;
    font-size: 16px;
    font-weight: bold;
    color: #555;
}

.player {
    font-size: 18px;
    font-weight: bold;
    color: #222;
}

.no-data {
    color: #888;
    margin-bottom: 0;
}

.prediction-title {
    font-size: 14px;
    font-weight: bold;
    color: #888;
    margin-bottom: 5px;
}

.comparison-table {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.comparison-row {
    display: grid;
    grid-template-columns: 55px repeat(4, 1fr);
    border-bottom: 1px solid #eee;
}

.comparison-row:last-child {
    border-bottom: none;
}

.comparison-row > div {
    padding: 10px 5px;
    text-align: center;
    border-right: 1px solid #eee;
    font-size: 14px;
}

.comparison-row > div:last-child {
    border-right: none;
}

.comparison-row.header {
    font-weight: bold;
    background: #0080c8;
    color: white;
}

.comparison-row:not(.header) > div:first-child {
    font-weight: bold;
    color: #0080c8;
}

.same-player {
    font-weight: bold;
    background: #e8f6ff;
}

.correct-answer {
    font-weight: bold;
    background: #d9f2ff;
    color: #0080c8;
}

.comparison-note {
    color: #888;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 10px;
}

.refresh-button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: none;
    border-radius: 10px;
    background: #0080c8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.home-button {
    display: inline-block;
    padding: 10px 20px;
    margin-bottom: 15px;
    background-color: #0080c8;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.home-button:hover {
    opacity: 0.85;
}

.score-box {
    background: #f8fbfd;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.score-number {
    font-size: 24px;
    font-weight: bold;
    color: #0080c8;
}

.ranking-note {
    color: #888;
    font-size: 13px;
    margin-top: -5px;
}

</style>
</head>

<body>

<a href="index.html" class="home-button">
    🏠 HOMEに戻る
</a>

<div class="container">

    <div class="header">

        <img
            src="logo.svg"
            alt="北海道日本ハムファイターズ"
            class="logo"
        >

        <h1>予想確認 ⚾️</h1>

    </div>

    <div class="date" id="gameInfo">
        試合情報を読み込み中...
    </div>

    <button
        onclick="location.reload()"
        class="refresh-button"
    >
        🔄 最新の予想に更新
    </button>

    <div id="comparison"></div>

    <div id="result"></div>

    <div id="seasonRanking"></div>

    <button
        onclick="saveGameResult()"
        class="refresh-button"
    >
        🏆 この試合の結果を保存
    </button>

</div>


<script>

const members = [
    "ともき",
    "えりか",
    "ほのか",
    "ゆな"
];

const result =
    document.getElementById("result");

const comparison =
    document.getElementById("comparison");


// ========================================
// 今日の日付
// ========================================

const today = new Date();

const todayString =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");


// ========================================
// 正解スタメン
// ========================================

const savedAnswer =
    localStorage.getItem("fightersAnswer");

let answer = null;

if (savedAnswer) {

    try {

        const answerData =
            JSON.parse(savedAnswer);

        // =========================
        // 新しい保存形式
        // =========================

        if (
            answerData &&
            !Array.isArray(answerData) &&
            answerData.answer
        ) {

            // 今日登録された正解スタメンだけ使用
            if (answerData.date === todayString) {

                answer = answerData.answer;

            }

        }

        // =========================
        // 旧い保存形式
        // =========================

        if (Array.isArray(answerData)) {

            answer = answerData;

        }

    } catch (error) {

        console.error(
            "正解スタメンの読み込みに失敗しました",
            error
        );

        answer = null;
    }

}


// ========================================
// 4人分の予想データ
// ========================================

const comparisonData = {};

members.forEach(function(member) {

    comparisonData[member] = {};

    const savedData =
        localStorage.getItem(
            "fightersPrediction_" + member
        );

    if (!savedData) {
        return;
    }

    try {

        const data =
            JSON.parse(savedData);

        // 今日の予想だけ表示
        if (data.date !== todayString) {
            return;
        }

        if (!data.prediction) {
            return;
        }

        data.prediction.forEach(function(player) {

            comparisonData[member][
                player.battingOrder
            ] = {

                player: player.player,

                position: player.position

            };

        });

    } catch (error) {

        console.error(
            member + "の予想データ読み込み失敗",
            error
        );

    }

});


// ========================================
// 採点
// ========================================

const scores = {};

const points = {};

members.forEach(function(member) {

    scores[member] = 0;

    if (!answer) {
        points[member] = 0;
        return;
    }

    for (let i = 1; i <= 9; i++) {

        const prediction =
            comparisonData[member][i];

        const correct =
            answer.find(function(item) {

                return item.battingOrder === i;

            });

        if (!prediction || !correct) {
            continue;
        }

        if (
            prediction.player === correct.player &&
            prediction.position === correct.position
        ) {

            scores[member]++;

        }

    }

    // 9人全部正解なら100点
    if (scores[member] === 9) {

        points[member] = 100;

    } else {

        points[member] = scores[member];

    }

});


// ========================================
// 現在のランキング
// ========================================

const ranking =
    members.slice().sort(function(a, b) {

        return points[b] - points[a];

    });


let scoreHtml = `

    <div class="member">

        <h2>🏆 現在のランキング</h2>

`;

if (!answer) {

    scoreHtml += `

        <p class="no-data">
            まだ正解スタメンが登録されていません。
        </p>

    `;

} else {

    ranking.forEach(function(member, index) {

        scoreHtml += `

            <div class="row">

                <div class="order">
                    ${index + 1}位
                </div>

                <div class="player">
                    ${member}
                </div>

                <div class="position">
                    ${points[member]}点
                </div>

            </div>

        `;

    });

}

scoreHtml += `

    </div>

`;

result.innerHTML = scoreHtml;


// ========================================
// みんなの予想比較
// ========================================

let comparisonHtml = `

    <h2>📊 みんなの予想を比較</h2>

    <p class="comparison-note">
        同じ選手を予想しているところが分かります
    </p>

    <div class="comparison-table">

        <div class="comparison-row header">

            <div>打順</div>
            <div>ともき</div>
            <div>えりか</div>
            <div>ほのか</div>
            <div>ゆな</div>

        </div>

`;


for (let i = 1; i <= 9; i++) {

    const predictions =
        members.map(function(member) {

            return comparisonData[member][i];

        });


    const playerNames =
        predictions.map(function(data) {

            return data ? data.player : null;

        });


    comparisonHtml += `

        <div class="comparison-row">

            <div>${i}番</div>

    `;


    predictions.forEach(function(data) {

        if (!data) {

            comparisonHtml += `
                <div>-</div>
            `;

            return;

        }


        const count =
            playerNames.filter(function(name) {

                return (
                    name &&
                    name === data.player
                );

            }).length;


        let className = "";

if (answer) {

    const correct =
        answer.find(function(item) {

            return (
                item.battingOrder === i &&
                item.player === data.player &&
                item.position === data.position
            );

        });

    if (correct) {

        className = "correct-answer";

    }

}


        comparisonHtml += `

            <div class="${className}">

                <strong>
                    ${data.position}
                </strong>

                <br>

                ${data.player}

            </div>

        `;

    });


    comparisonHtml += `

        </div>

    `;

}


comparisonHtml += `

    </div>

`;

comparison.innerHTML =
    comparisonHtml;


// ========================================
// 各メンバーの詳細予想
// ========================================

members.forEach(function(member) {

    const box =
        document.createElement("div");

    box.className =
        "member";

    let data = null;

    const savedData =
        localStorage.getItem(
            "fightersPrediction_" + member
        );

    if (savedData) {

        try {

            const saved =
                JSON.parse(savedData);

            if (
                saved.date === todayString &&
                saved.prediction
            ) {

                data = saved;

            }

        } catch (error) {

            console.error(
                member + "の予想データ解析失敗",
                error
            );

        }

    }


    if (data) {

        let html = `

            <h2>👤 ${member}</h2>

            <div class="prediction-title">
                予想スタメン
            </div>

        `;


        data.prediction.forEach(function(player) {

            html += `

                <div class="row">

                    <div class="order">
                        ${player.battingOrder}番
                    </div>

                    <div class="position">
                        ${player.position || "-"}
                    </div>

                    <div class="player">
                        ${player.player || "-"}
                    </div>

                </div>

            `;

        });


        box.innerHTML =
            html;

    } else {

        box.innerHTML = `

            <h2>👤 ${member}</h2>

            <p class="no-data">
                まだ今日の予想が登録されていません。
            </p>

        `;

    }


    result.appendChild(box);

});


// ========================================
// 試合情報
// ========================================

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxzMrd3EuNkf0bzze0s7sidnF8oTEbEuPvE3nrJ5oKMWCoirMgftWZezRgeSDiU1eqh2g/exec";


let todayGame = null;


fetch(GAS_URL)

    .then(function(response) {

        return response.json();

    })

    .then(function(games) {

        todayGame =
            games.find(function(game) {

                return game.date === todayString;

            });


        const gameInfo =
            document.getElementById("gameInfo");


        if (!todayGame) {

            gameInfo.innerHTML =
                "本日の試合情報はありません";

            return;

        }


        const date =
            new Date(
                todayGame.date +
                "T00:00:00"
            );


        const weekdays =
            [
                "日",
                "月",
                "火",
                "水",
                "木",
                "金",
                "土"
            ];


        gameInfo.innerHTML = `

            <strong>

                ${date.getFullYear()}年
                ${date.getMonth() + 1}月
                ${date.getDate()}日
                （${weekdays[date.getDay()]}）

            </strong>

            <br><br>

            北海道日本ハムファイターズ

            <br>

            VS

            <br>

            ${todayGame.opponent}

            <br><br>

            📍 ${todayGame.stadium}

            <br>

            🕐 ${todayGame.time}

        `;

    })

    .catch(function(error) {

        console.error(
            "試合情報の取得に失敗しました",
            error
        );


        document.getElementById("gameInfo")
            .textContent =
            "試合情報を取得できませんでした";

    });


// ========================================
// 試合結果を保存
// ========================================

function saveGameResult() {

    if (!answer) {

        alert(
            "正解スタメンがまだ登録されていません。"
        );

        return;

    }


    const gameDate =
        todayGame
            ? todayGame.date
            : todayString;


    const opponent =
        todayGame
            ? todayGame.opponent
            : "";


    const gameResult = {

        gameDate: gameDate,

        opponent: opponent,

        scores: points,

        savedAt:
            new Date().toISOString()

    };


    const storageKey =
        "fightersGameResultV2_" +
        gameDate;


    localStorage.setItem(
        storageKey,
        JSON.stringify(gameResult)
    );


    alert(
        "🏆 この試合の結果を保存しました！"
    );


    showSeasonRanking();

}


// ========================================
// シーズン通算ランキング
// ========================================

function showSeasonRanking() {

    const totals = {};

    members.forEach(function(member) {

        totals[member] = 0;

    });


    for (
        let i = 0;
        i < localStorage.length;
        i++
    ) {

        const key =
            localStorage.key(i);


        // 新しい形式だけ集計
        if (
            !key.startsWith(
                "fightersGameResultV2_"
            )
        ) {

            continue;

        }


        const savedData =
            localStorage.getItem(key);


        if (!savedData) {
            continue;
        }


        try {

            const gameResult =
                JSON.parse(savedData);


            members.forEach(function(member) {

                if (
                    gameResult.scores &&
                    gameResult.scores[member] !== undefined
                ) {

                    totals[member] +=
                        gameResult.scores[member];

                }

            });

        } catch (error) {

            console.error(
                "試合結果の読み込みに失敗しました",
                error
            );

        }

    }


    const ranking =
        members.slice().sort(function(a, b) {

            return totals[b] - totals[a];

        });


    let html = `

        <div class="member">

            <h2>🏆 シーズン通算ランキング</h2>

            <p class="ranking-note">
                新しい形式で保存した試合のみ集計しています
            </p>

    `;


    ranking.forEach(function(member, index) {

        html += `

            <div class="row">

                <div class="order">
                    ${index + 1}位
                </div>

                <div class="player">
                    ${member}
                </div>

                <div class="position">
                    ${totals[member]}点
                </div>

            </div>

        `;

    });


    html += `

        </div>

    `;


    document.getElementById(
        "seasonRanking"
    ).innerHTML = html;

}


// ページを開いたら表示
showSeasonRanking();

</script>

</body>
</html>
